# cargo-deny policy (issue #66).
#
# Scope is deliberately narrow: this file exists to make the audit job's
# verdict reproducible and reviewable, not to encode taste. Every deviation
# from cargo-deny's defaults is justified in place (§8) so a future reader can
# refute it rather than guess at intent.

[advisories]
# RUSTSEC advisories are a blocking condition, not a warning: this binary
# reads and indexes a user's entire source tree.
yanked = "deny"
# No blanket ignores. An accepted advisory is added here WITH its RUSTSEC id
# and a written reason, never as a silent list entry.
#
# CLEARED by the #78 upgrades (tantivy 0.22.1 -> 0.26.1, lbug 0.15.4 -> 0.18.3):
#   RUSTSEC-2024-0384  instant     unmaintained  -> crate is GONE from the tree
#                                                   (it came via measure_time <- tantivy 0.22)
#   RUSTSEC-2026-0002  lru         unsound       -> 0.12.5 -> 0.16.4, and the
#                                                   advisory is patched >= 0.16.3
# Their entries are removed rather than left behind: an ignore for an advisory
# the tree no longer raises is dead config that hides the live one.
# RUSTSEC-2026-0202 is now fixed by cxx 1.0.205 under lbug 0.21.2.
# Its old exact-pin exception is removed; no advisory is ignored.
ignore = []

[licenses]
# Permissive licenses only. This ships as a redistributable binary, so a
# copyleft dependency is a distribution question that must be decided
# deliberately rather than discovered at release time.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"   # advisory: duplicate versions are bloat, not risk
wildcards = "deny"           # a wildcard version defeats Cargo.lock pinning
# ...but a PATH dependency has no version requirement to state, and the path IS
# the pin: `zera = { path = "crates/zera" }` is an in-workspace crate, not an
# unpinned registry fetch. Without this, `wildcards = "deny"` fails on our own
# workspace layout, which would be a gate failing on a non-problem.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
