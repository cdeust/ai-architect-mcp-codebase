# Bounds lbug's virtual-address-space reservation during `cargo test`.
#
# Root cause (issue #21 extension): `lbug::SystemConfig::default()` leaves
# `max_db_size` at a sentinel value that lbug's C++ core resolves to
# `DEFAULT_VM_REGION_MAX_SIZE = 1 << 43` (8 TiB) per Database instance — see
# the doc comment on `graph_store::system_config()` in src/graph_store.rs for
# the full trace into the vendored lbug-0.15.4 source. Running
# `cargo test --workspace` opens dozens of embedded databases concurrently
# (one process per integration-test binary, default test parallelism within
# each); each reserving 8 TiB of address space exhausts the process's virtual
# address space probabilistically, producing intermittent
# `Mmap for size 8796093022208 failed` failures.
#
# [env] applies to every process cargo spawns for this workspace — build
# scripts, `cargo run`, and every `cargo test` binary (verified empirically
# 2026-07-15: a probe test read this table's value at runtime without any
# code change). It does NOT apply to a compiled binary invoked directly
# (e.g. a deployed release binary run outside cargo), so production capacity
# is unaffected by this bound.
[env]
# 4 GiB (2^32 bytes — must be a power of two per lbug's
# BufferManager::verifySizeParams). Was 512 MiB (source: measured 2026-07-15
# — the largest test fixture at the time, tests/scalability_bench.rs's
# 500-file synthetic Rust fixture, produced a 34 MB on-disk database).
#
# Raised for full-AST persistence (issue full-ast-index): `AstNode` +
# `AstChild_AstNode_AstNode` add one row per tree-sitter node (named AND
# anonymous), not just the semantic-symbol subset — roughly 2x the row count
# of the pre-existing symbol-only schema, PLUS the parent->child edges at the
# same cardinality. `indexer::tests::test_index_own_project` indexes THIS
# repo's own `src/` (the largest fixture ANY test in this workspace indexes)
# at full scale, and 512 MiB was hit mid-run — the lbug buffer manager
# returned a clean `Query execution failed: ... Maximum database size ...`
# error, but a SUBSEQUENT unrelated query on the same connection then
# SIGSEGV'd (observed 2026-08-09, reproduced twice) — hitting the cap
# mid-transaction appears to leave the embedded engine's C++ state
# unrecoverable, not just refuse the one write. Raising the ceiling avoids
# ever exercising that condition in the test suite; it does not fix the
# underlying lbug fragility, which is out of this crate's control (a Rust
# wrapper around a vendored C++ engine). 4 GiB gives >2x headroom over the
# largest full-AST measurement taken for this PR (see PR description for the
# exact number) while staying a small fraction of the 8 TiB lbug reserves by
# default.
AP_LBUG_TEST_MAX_DB_SIZE = "4294967296"

# Source: Cargo.lock lbug 0.21.2 and LadybugDB/ladybug release v0.21.2.
# The crate's build.rs otherwise downloads releases/latest, outside Cargo.lock.
# LBUG_VERSION changes its native cache namespace and triggers a rebuild.
# check_distribution_identity.py requires this value to match Cargo.lock.
LBUG_VERSION = "0.21.2"

# The C++ glue that lbug compiles on this machine has to come from the same GCC
# major as the prebuilt liblbug.a it is linked with. That archive (release
# v0.21.2, "compat" variant) is built with "GCC: (GNU) 13.3.1 20240611 (Red Hat
# 13.3.1-2)" (readelf -p .comment). lbug's build.rs compiles its glue
# (ffi.rs.cc, lbug_rs.cpp, lbug_partition_routing.cpp) with the system g++.
# Both sides emit the inline std::format machinery as weak symbols, for example
# std::__format::_Sink<char>::_M_write, and the linker keeps one copy. When the
# system g++ is 15, the kept copy comes from GCC 15's <format>, but the code in
# the archive was compiled against GCC 13's. Measured on ubuntu-26.04 (g++ 15.2):
# Binder::bindCopyToClause -> _Sink<char>::_M_write (/usr/include/c++/15/format)
# fails the assertion "__offset <= size()" in span::subspan. The heap is then
# corrupt: SIGABRT on arm64, SIGSEGV on the x86_64 runner. CI runs
# 40818203993, 40824923232 and 40826628851 crashed this way. Commit 7212c25 was
# green on ubuntu-24.04 (run 40642626065, attempt 1) and hit SIGSEGV on
# ubuntu-26.04 (attempt 2): ubuntu-latest moved from 24.04 to 26.04.
# With only the glue compiler switched to g++ 13.4, the same image runs the
# crashing test green.
#
# Only CXX is pinned. The conflict is between C++ template instantiations; the
# C objects share no inline templates. Both runner images ship g++-13: 24.04
# ships 12.4/13.3/14.2, 26.04 ships 13.4/14.3/15.2 (actions/runner-images
# readmes). The target-specific names apply on Linux only and leave macOS and
# Windows on their default compilers. An exported variable of the same name
# still overrides these values. Revisit this pin when LBUG_VERSION moves:
# scripts/check_lbug_glue_toolchain.py fails CI when the two sides diverge.
CXX_x86_64_unknown_linux_gnu = "g++-13"
CXX_aarch64_unknown_linux_gnu = "g++-13"
