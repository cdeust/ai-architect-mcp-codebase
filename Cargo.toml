[workspace]
# source: benches/harness is the end-result evaluation harness (stage-3b-v2 §2).
# Lives as a workspace member so its deps (clap, tempfile) stay out of the
# main crate.
# crates/zera: ZERA protocol reference implementation. Workspace member so
# its deps (blake3) stay isolated from the main crate; spec at
# docs/protocols/ZERA-spec.md.
members = [".", "benches/harness", "benchmarks/token_surface", "benchmarks/incremental_speed", "benchmarks/eval_headtohead", "crates/zera"]
# `fuzz` is deliberately EXCLUDED, not a member: libfuzzer-sys needs a nightly
# toolchain and links LLVM's libFuzzer runtime, while this workspace is pinned to
# stable 1.95.0 (rust-toolchain.toml). Excluding it keeps `cargo build` and
# `cargo clippy --workspace` on stable while the fuzz targets stay real code that
# CI compiles and runs on nightly (.github/workflows/fuzz.yml).
exclude = ["fuzz"]

[package]
# `ai-architect-mcp-codebase` is the canonical distribution identity across
# crates.io, GitHub, release assets, and the MCP Registry. The old executable
# remains as a compatibility alias for existing scripts and host configs.
name = "ai-architect-mcp-codebase"
version = "0.11.0"
edition = "2021"
description = "Cross-platform codebase-intelligence MCP server: tree-sitter parsing into a LadybugDB graph, cross-file resolution, hybrid search, and impact analysis for AI agents."
license = "MIT"
repository = "https://github.com/cdeust/ai-architect-mcp-codebase"
homepage = "https://ai-architect.tools"
readme = "README.md"
# crates.io caps keywords at 5; category slugs from https://crates.io/categories
keywords = ["mcp", "code-intelligence", "tree-sitter", "code-graph", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]
# Whitelist packaging: the repo carries benches/corpora, stage specs,
# test fixtures, and CI config that would bloat the .crate file. Only
# what `cargo build` needs (plus README/LICENSE) ships. Patterns are
# gitignore-style — the leading `/` anchors them to the package root.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/mcp-contract.json"]

[lib]
# Keep the Rust import path stable for workspace consumers and downstream users.
name = "ai_architect_mcp"
path = "src/lib.rs"

[[bin]]
name = "ai-architect-mcp-codebase"
path = "src/main.rs"

[[bin]]
# Compatibility alias only. Do not duplicate the binary's 500+ unit tests in
# `--all-targets`; the canonical target above is the test-bearing executable.
name = "automatised-pipeline"
path = "src/bin/automatised-pipeline.rs"
test = false
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# source: issue #59 host installer — Codex's config.toml is edited surgically so
# the user's existing comments and formatting survive. toml_edit is the
# format-preserving TOML editor (unlike serde+toml which normalizes on
# reserialize). Already in the dependency graph via benches/harness (toml 0.8).
toml_edit = "0.25"
# source: stages/stage-2.md §12.4 — sha256 for stage-2 transcript_digest.
# RustCrypto/hashes, primitive-only, audited since 2018. Single-purpose,
# well-known, sourced — the only kind of dep the zetetic standard allows.
sha2 = "0.11"
# source: stages/stage-3.md §7 — LadybugDB graph store for code-intelligence graph.
# In-process property graph DB, MIT licensed, Cypher query language.
lbug = "0.19"
# source: stages/stage-3.md §3a — tree-sitter parser runtime + Rust grammar.
# MIT licensed. Used by rust_parser.rs to extract typed symbols from .rs files.
# Bumped 0.24 → 0.25: 0.25 is the first runtime supporting grammar ABI 15,
# required by tree-sitter-swift 0.7.3 (ABI 15). 0.24.7 capped at ABI 14 →
# set_language() failed for Swift and the file was silently skipped.
# source: github.com/tree-sitter/tree-sitter CHANGELOG 0.25.0 (ABI 15 support).
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
# source: multi-language parser support — Python and TypeScript grammars.
# MIT licensed. Used by parser/python.rs and parser/typescript.rs.
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
# source: multi-language parser expansion — JVM + Apple + systems + Go.
# Each grammar crate is an official tree-sitter parser published on crates.io,
# MIT or Apache-2.0 licensed, and used by parser/<lang>.rs to extract typed
# symbols matching the graph_store schema.
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-objc = "3.0"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-ruby = "0.23"
# source: stages/stage-3-research.md §2 — Tantivy for BM25 full-text search.
# In-process search engine, MIT licensed (quickwit-oss).
tantivy = "0.26"
# source: issue #55 (team-shared graph artifact) — the reference implementation
# DeusData/codebase-memory-mcp src/pipeline/artifact.c compresses the graph
# snapshot with zstd (two tiers: best/9 on explicit index, fast/3 for the
# watcher). Rust bindings for zstd 1.5.7 (facebook/zstd, BSD-licensed); already
# in the tree transitively via tantivy, promoted to a direct dep here.
zstd = "0.13"
# source: issue #55 — AP's graph store is a directory (lbug 0.15 database
# layout), so the snapshot is a tar archive before zstd (the C reference used
# SQLite's single-file VACUUM INTO; we archive the dir instead). tar-rs
# (alexcrichton/tar-rs), MIT/Apache-2.0; unpack rejects `..`/absolute paths, so
# a committed artifact cannot path-traverse on bootstrap import.
tar = "0.4"

[dev-dependencies]
tempfile = "3"
# Source: ZERA S1 — the zera-hello integration test needs the crate to
# call hello() against a real indexed graph from this workspace.
zera = { path = "crates/zera" }

[profile.release]
opt-level = 3
lto = "thin"
