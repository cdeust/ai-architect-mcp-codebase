[package]
name = "eval-headtohead-bench"
version = "0.0.1"
edition = "2021"
# Same terms as the workspace root (see LICENSE). Declared explicitly so
# `cargo deny check licenses` can classify this crate instead of reporting it
# as unlicensed (issue #66).
license = "MIT"
description = "Issue #64 falsifiable head-to-head evaluation: AP graph tools vs a Grep/Glob/Read baseline over a committed multi-language corpus. Pre-registered (PRE_REGISTRATION.md), two conditions, five capability dimensions, precision/recall/token/tool-call metrics with dispersion, and a config-gated blinded LLM-judge leg. Writes results.json + raw_results.json."
publish = false

[[bin]]
name = "eval_headtohead_bench"
path = "src/main.rs"

[dependencies]
# The library under test — drives the real indexer/resolver/clustering/search,
# so the GRAPH condition measures the exact code paths the MCP tools run.
ai-architect-mcp = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Corpus provenance hash recorded in MANIFEST.md — the corpus IS the pin
# (§AC5). Same crate the main library already uses for stage-2 digests.
sha2 = "0.11"
