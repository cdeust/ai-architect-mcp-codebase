[package]
name = "token-surface-bench"
version = "0.0.1"
edition = "2021"
# Same terms as the workspace root (see LICENSE). Declared explicitly so
# `cargo deny check licenses` can classify this crate instead of reporting it
# as unlicensed (issue #66).
license = "MIT"
description = "Falsifiable token-efficiency benchmark for the issue #56 token surface: a fixed 5-query workload measured as ids/tabular vs current JSON, and graph-tools vs a scripted grep/read transcript. Writes results.json + reads MANIFEST.md."
publish = false

[[bin]]
name = "token_surface_bench"
path = "src/main.rs"

[dependencies]
# The library under test — drives the real indexer/resolver/clustering/search
# and the shared token_surface renderer, so the measured shapes are the ones the
# MCP tools emit (not a re-implementation).
ai-architect-mcp = { package = "ai-architect-mcp-codebase", path = "../.." }
serde_json = "1"
# Per-run fixture graph in a tempdir (matches the tests' pattern).
tempfile = "3"
