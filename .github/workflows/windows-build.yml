name: Windows build

# The windows-x86_64 leg of release.yml only ever runs on a `v*` tag, and it is
# `continue-on-error`. Both together are why a broken Windows build reached
# v0.8.3 and silently dropped the platform: no pre-merge signal existed, and the
# failure did not redden the release (#176). This job is that missing signal —
# same target, same pinned toolchain, same OpenSSL shim as the release leg, run
# on every pull request so a break costs a red check instead of a published
# release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: cargo build (windows-x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-

      # lbug's build.rs has asked for OpenSSL under two different names on
      # Windows, and switched once already: lbug 0.15 (v0.8.2's build) did not
      # link OpenSSL at all; 0.18 asked the linker for the bare `ssl` and
      # `crypto` (MSVC turns those into ssl.lib / crypto.lib, a filename no
      # Windows OpenSSL distribution ships — #176). 0.20 reversed that and
      # asks for `libssl` / `libcrypto` instead, matching vcpkg's own naming
      # (lbug's build.rs now calls vcpkg::find_package("openssl") first).
      # The runner image's OpenSSL install ships libssl.lib / libcrypto.lib
      # either way, so the shim copies both name pairs rather than betting on
      # whichever convention the pinned lbug version currently wants — a
      # future lbug bump can move between them without a workflow edit.
      #
      # Copies under both expected names into a scratch dir and puts that dir
      # on rustc's native search path. `-L native=` is additive, unlike
      # overwriting LIB, which would clobber the MSVC library paths cc-rs
      # discovers.
      - name: Provide ssl.lib/crypto.lib and libssl.lib/libcrypto.lib to the MSVC linker
        run: |
          set -euo pipefail
          SHIM="$RUNNER_TEMP/openssl-shim"
          mkdir -p "$SHIM"
          for d in \
            "/c/Program Files/OpenSSL/lib/VC/x64/MD" \
            "/c/Program Files/OpenSSL/lib/VC" \
            "/c/Program Files/OpenSSL/lib" \
            "/c/vcpkg/installed/x64-windows/lib"
          do
            if [ -f "$d/libssl.lib" ] && [ -f "$d/libcrypto.lib" ]; then
              cp "$d/libssl.lib" "$SHIM/ssl.lib"
              cp "$d/libcrypto.lib" "$SHIM/crypto.lib"
              cp "$d/libssl.lib" "$SHIM/libssl.lib"
              cp "$d/libcrypto.lib" "$SHIM/libcrypto.lib"
              echo "shimmed OpenSSL import libs (both naming conventions) from: $d"
              ls -la "$SHIM"
              echo "RUSTFLAGS=-L native=$(cygpath -w "$SHIM")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          # Fail loudly with the evidence rather than letting the build reach a
          # link error whose cause is one directory listing away.
          echo "::error::no libssl.lib/libcrypto.lib found in any known location"
          find "/c/Program Files/OpenSSL" -name '*.lib' 2>/dev/null | head -20 || true
          exit 1

      - name: Build
        run: cargo build --release --bin ai-architect-mcp-codebase --target x86_64-pc-windows-msvc

      - name: Confirm the binary exists
        run: ls -la target/x86_64-pc-windows-msvc/release/ai-architect-mcp-codebase.exe
