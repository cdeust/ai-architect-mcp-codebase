name: Marketplace pin gate

# AP issue #67 (pattern: Cortex #179): releasing a downstream plugin does not ship it — delivery is
# gated by the version pinned in .claude-plugin/marketplace.json. Six
# zetetic-team-subagents releases and two cortex-viz releases went out
# unpublished with no signal. This workflow makes a stale pin a red run.
#
# Cron matters more than the PR trigger: pins go stale by INACTION, and
# inaction never opens a PR. Weekly is bounded staleness (max 7 days),
# vs unbounded before.

on:
  pull_request:
    paths:
      - ".claude-plugin/marketplace.json"
      - "scripts/check_marketplace_pins.py"
      - "scripts/marketplace_pins_http.py"
      - "scripts/marketplace_pins_semver.py"
      - "scripts/marketplace_pins_github.py"
      - "scripts/marketplace_pins_self.py"
      - "scripts/marketplace_pins_manifests.py"
      - "scripts/marketplace_pins_registry.py"
      - "scripts/tests/test_check_marketplace_pins.py"
      - ".github/workflows/marketplace-pins.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — weekly bound on pin staleness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pins:
    name: pins current vs latest releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Unit tests (gate logic, all arms incl. offline)
        run: python3 -m unittest scripts/tests/test_check_marketplace_pins.py -v 2>&1 | tail -5
      - name: Check marketplace pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_marketplace_pins.py

  canonical-drift:
    name: byte-identical with canonical copy (cdeust/Cortex)
    # Cron-only: drift is an inaction failure; PR runs must not depend on
    # the sibling repo's merge state.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Diff against canonical
        # All seven files that make up the gate — the composition root PLUS
        # its five sibling modules, which now carry the actual checking
        # logic (check_marketplace_pins.py's own module docstring asserts
        # this diffs weekly and fails on drift; guarding one file out of
        # seven made that claim false). One `diff` per file so a single
        # drifted module fails the step with its own name in the output,
        # rather than a combined diff that buries which file moved.
        run: |
          status=0
          for f in check_marketplace_pins.py \
                   marketplace_pins_http.py \
                   marketplace_pins_semver.py \
                   marketplace_pins_github.py \
                   marketplace_pins_self.py \
                   marketplace_pins_manifests.py \
                   marketplace_pins_registry.py; do
            curl -fsSL "https://raw.githubusercontent.com/cdeust/Cortex/main/scripts/$f" -o "/tmp/canonical-$f"
            if ! diff -u "/tmp/canonical-$f" "scripts/$f"; then
              status=1
            fi
          done
          exit "$status"
