name: DCO

# Every PR commit must carry a Signed-off-by trailer matching its author.
# source: GOVERNANCE.md "Contribution licensing"

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: every commit signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on each commit of the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Bot authors that cannot sign off. An explicit list, not a pattern.
          exempt_authors="dependabot[bot]"
          fail=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            name=$(git show -s --format='%an' "$sha")
            email=$(git show -s --format='%ae' "$sha")
            if printf '%s\n' "$exempt_authors" | grep -Fxq "$name"; then
              echo "exempt  $sha  $name"
              continue
            fi
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | grep -Fxq "$name <$email>"; then
              echo "ok      $sha  $name <$email>"
            else
              echo "::error::commit $sha by $name <$email> has no matching Signed-off-by trailer"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign off with: git commit -s   (fix a branch: git rebase --signoff $BASE_SHA)"
            exit 1
          fi
